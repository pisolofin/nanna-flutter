name: nanna
description: A comprehensive set of utilities, extensions, widgets, and services for Flutter development.
version: 1.0.1
repository: https://github.com/pisolofin/nanna-flutter

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_secure_storage: ^10.3.1
  toastification: ^3.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  lints: ^6.1.0

executables:
  format-alignment: format-alignment
  format-imports: format-imports
